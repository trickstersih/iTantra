name: Test pushed Piper TTS models

on:
  push:
    branches:
      - mesh-topology-discovery
    paths:
      - "app/src/main/assets/models/tts_piper(10).zip"
      - "tools/tts_test/**"
      - ".github/workflows/test-tts-models.yml"
  workflow_dispatch:

jobs:
  test-tts-models:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v5
        with:
          ref: mesh-topology-discovery

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Piper test runtime
        run: python -m pip install -r tools/tts_test/requirements.txt

      - name: Inspect model archive
        run: python tools/tts_test/inspect_tts_zip.py "app/src/main/assets/models/tts_piper(10).zip"

      - name: Synthesize every model
        run: python tools/tts_test/test_piper_models.py "app/src/main/assets/models/tts_piper(10).zip"

      - name: Upload audio and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itantra-tts-test-results
          path: |
            tts_test_run_*/
          retention-days: 7
